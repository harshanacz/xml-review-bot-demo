name: XML PR Review

on:
  pull_request:
    paths:
      - "**/*.xml"             # run when XML files are touched
      - ".xml-review.json"     # or the bot config / code changes
      - "src/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents:      read
  pull-requests: write   # needed to post review comments

# A new push to the PR cancels the review of the previous commit.
concurrency:
  group: xml-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  xml-review:
    name: Validate XML files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Check out the PR head (so local XML files are available)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # 2. Set up Node.js with npm cache
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 3. Reproducible install from the lockfile
      #    (xml-language-service + xerces-wasm 2.x)
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 4. Make sure the reviewer itself works before trusting its verdict
      - name: Self-test
        run: npm test

      # 5. Run the reviewer
      - name: Run XML reviewer
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          PR_NUMBER:          ${{ github.event.pull_request.number }}
          GITHUB_WORKSPACE:   ${{ github.workspace }}
          HEAD_SHA:           ${{ github.event.pull_request.head.sha }}
        run: node src/review.mjs
